<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alien Defender: The Last Stand</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>ALIEN DEFENDER <span>The Last Stand</span></h1>
    <span id="server-status" class="status">Checking server…</span>
  </header>

  <main class="stage">
    <div class="game-frame">
      <canvas id="game-canvas" aria-label="Alien Defender game area"></canvas>

      <!-- Overlays: only one is visible at a time, chosen by the game state. -->
      <section id="screen-menu" class="overlay" data-state="menu">
        <h2 class="title">ALIEN DEFENDER</h2>
        <p class="tagline">The Last Stand</p>
        <fieldset class="difficulty" aria-label="Difficulty">
          <legend>Difficulty</legend>
          <label><input type="radio" name="difficulty" value="easy"><span><strong>Easy</strong><small>Slower aliens, sturdier Earth</small></span></label>
          <label><input type="radio" name="difficulty" value="normal" checked><span><strong>Normal</strong><small>The intended challenge</small></span></label>
          <label><input type="radio" name="difficulty" value="hard"><span><strong>Hard</strong><small>Faster, tougher, 1.5x score</small></span></label>
        </fieldset>
        <button id="btn-start" class="btn primary">Start Game</button>
        <p class="controls">WASD / Arrows: move · Space: shoot · 1–4: abilities · P / Esc: pause · Enter: start</p>
      </section>

      <section id="screen-paused" class="overlay" data-state="paused" hidden>
        <h2>Paused</h2>
        <button id="btn-resume" class="btn primary">Resume</button>
        <button id="btn-quit" class="btn">Quit to Menu</button>
      </section>

      <!-- Knowledge Challenge Arena: opens automatically after every wave. -->
      <section id="screen-arena" class="overlay arena" data-state="quiz" hidden aria-labelledby="arena-title">
        <div class="arena-panel">
          <h2 id="arena-title" data-arena="title">Knowledge Challenge Arena</h2>
          <p class="tagline" data-arena="subtitle"></p>
          <div data-arena="body" class="arena-body" aria-live="polite"></div>
        </div>
      </section>

      <section id="screen-gameover" class="overlay" data-state="gameOver" hidden>
        <h2 id="gameover-title" class="danger">Earth Has Fallen</h2>
        <dl id="gameover-summary" class="summary"></dl>
        <button class="btn primary" data-action="restart">Play Again</button>
        <button class="btn" data-action="menu">Main Menu</button>
      </section>

      <section id="screen-victory" class="overlay" data-state="victory" hidden>
        <h2 class="victory">Earth Is Safe</h2>
        <dl id="victory-summary" class="summary"></dl>
        <button class="btn primary" data-action="restart">Play Again</button>
        <button class="btn" data-action="menu">Main Menu</button>
      </section>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
